name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: { node-version: "24" }
      - uses: actions/setup-python@v7.1.0
        with: { python-version: "3.12" }
      - run: npm ci
        working-directory: backend
      - run: node --test test/security.test.js
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --test test/admission.mjs
        working-directory: frontend
      - run: pip install -r bot/requirements.txt
      - run: python -m unittest discover -s bot -p 'test_*.py'
      - run: python -m unittest discover -s deploy -p 'test_*.py'
      - run: node --test deploy/test-portfolio.mjs deploy/test-portfolio-apply.mjs
