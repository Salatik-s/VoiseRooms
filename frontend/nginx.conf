server {
 listen 5173;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml;
 client_max_body_size 11m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(self), display-capture=(self)" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; worker-src 'self' blob:; media-src 'self' blob:; img-src 'self' data: blob:; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ {
  proxy_pass http://backend:3000;
  proxy_set_header Host $host;
  proxy_buffering off;
  proxy_read_timeout 30s;
 }
 location /healthz { access_log off; return 200 "ok\n"; }
 location /assets/ { try_files $uri =404; expires 30d; }
 location / { try_files $uri $uri/ /index.html; expires -1; }
}
