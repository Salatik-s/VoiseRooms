plugins { id 'com.android.application' }

android {

 namespace 'ru.voicerooms'

 compileSdk 35

 buildToolsVersion '34.0.0'

 defaultConfig {

  applicationId 'ru.voicerooms'

  minSdk 26

  targetSdk 35

  versionCode 120

  versionName '1.2.0'

  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

 }

 buildFeatures { buildConfig true }

 signingConfigs {

  release {

   if (System.getenv('VR_KEYSTORE')) {

    storeFile file(System.getenv('VR_KEYSTORE'))

    storePassword System.getenv('VR_KEYSTORE_PASSWORD')

    keyAlias System.getenv('VR_KEY_ALIAS')

    keyPassword System.getenv('VR_KEY_PASSWORD')

   }

  }

 }

 buildTypes {

  release {

   minifyEnabled true

   shrinkResources true

   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

   if (System.getenv('VR_KEYSTORE')) signingConfig signingConfigs.release

  }

  debug { applicationIdSuffix '.debug'; debuggable true }

 }

 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

}

dependencies { implementation 'androidx.webkit:webkit:1.12.1'; implementation 'androidx.core:core:1.13.1'; testImplementation 'junit:junit:4.13.2'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test:core:1.6.1'; androidTestImplementation 'androidx.test.ext:junit:1.2.1'; androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0' }

