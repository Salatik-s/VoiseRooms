name: VoiceRooms
options:
  bundleIdPrefix: ru.voicerooms
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "12"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
targets:
  VoiceRooms:
    type: application
    platform: iOS
    sources: [VoiceRooms]
    info:
      path: VoiceRooms/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.voicerooms.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [VoiceRoomsUITests]
      gatherCoverageData: false
  VoiceRoomsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VoiceRoomsUITests]
    dependencies:
      - target: VoiceRooms
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.voicerooms.app.uitests
        GENERATE_INFOPLIST_FILE: YES
